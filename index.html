<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1224" />

    <title>FixPoint | Earbuds &amp; Earphones Repair in Karachi</title>
    <meta
      name="description"
      content="FixPoint provides professional earbuds and wireless earphones repair services in Karachi. Repair services for ZERO, Audionic, Tech Hunk and more."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://fixpoint.netlify.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FixPoint" />
    <meta property="og:title" content="FixPoint | Earbuds & Earphones Repair in Karachi" />
    <meta
      property="og:description"
      content="Professional wireless earbuds, earphones and charging case repair in Karachi. Get a quick diagnosis and repair quote on WhatsApp."
    />
    <meta property="og:url" content="https://fixpoint.netlify.app/" />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:locale" content="en_PK" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FixPoint | Earbuds & Earphones Repair in Karachi" />
    <meta
      name="twitter:description"
      content="Professional wireless earbuds, earphones and charging case repair in Karachi."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Hidden static form so Netlify's build-time bot can detect and register
      this form. Field names must exactly match the React-rendered form in
      src/components/RepairForm.tsx.
    -->
    <form
      name="repair-inquiry"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="fullName" />
      <input type="text" name="phone" />
      <input type="text" name="brand" />
      <input type="text" name="model" />
      <input type="text" name="problem" />
      <textarea name="details"></textarea>
      <input type="text" name="contactMethod" />
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
